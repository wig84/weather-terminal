<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Termweather · Budapest</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f30;--muted:#9aafc2;--text:#f4f8fc;--blue:#1685ff;--cyan:#20d9ef;--yellow:#ffcb35;--green:#66f59c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#132b42 0,#07111f 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
body.terminal{background:#030707;color:#c9f8e1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 12px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.place{font-size:1.4rem;font-weight:750}.date{color:var(--muted);margin-top:4px}.timezone{font-size:.78rem;color:var(--muted)}
.switches{display:flex;gap:5px;background:#14283b;padding:4px;border-radius:15px;margin:18px 0 14px}.switches a{flex:1;text-align:center;text-decoration:none;color:#c7d7e5;padding:10px 4px;border-radius:11px;font-size:.86rem}.switches a.active{background:var(--blue);color:white;font-weight:700}
.days{display:flex;gap:8px;margin-top:14px}.days button{border:0;border-radius:12px;background:#1a3044;color:#dceaf6;padding:10px 18px;font-size:1rem;flex:1}.days button.active{background:var(--blue);color:white}
main{max-width:760px;margin:auto;padding:0 14px 36px}.hero{border-radius:24px;padding:18px;background:linear-gradient(135deg,#16344b,#0d1b2a);display:flex;align-items:center;gap:16px}.bigicon{font-size:3.4rem}.current{font-size:3.3rem;font-weight:750;letter-spacing:-2px;line-height:1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-left:auto;font-size:.9rem}.summary span{display:block;color:var(--muted);font-size:.75rem}.section{margin-top:20px}.section h2{font-size:.86rem;text-transform:uppercase;letter-spacing:.12em;color:#9eb7cb;font-weight:650}.panel{background:#0e2030;border:1px solid #1b3549;border-radius:19px;padding:15px}.chart{width:100%;height:auto;display:block}.hourlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;padding:0 5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#132a3d;border-radius:14px;padding:13px 8px;text-align:center}.metric b{display:block;font-size:1.1rem}.metric span{color:var(--muted);font-size:.75rem}.hour-list{display:grid;gap:8px}.hour{display:grid;grid-template-columns:48px 30px 1fr auto;align-items:center;gap:8px;padding:12px;border-radius:15px;background:#102438;border:1px solid #1b3549}.hour .time{color:#adc2d4;font-variant-numeric:tabular-nums}.hour .icon{font-size:1.25rem}.hour .temp{font-size:1.15rem;font-weight:700}.hour .details{font-size:.72rem;color:#b2c8d8;text-align:right;line-height:1.55}.terminal header,.terminal main{max-width:900px}.terminal .place{color:#f7e900;font-size:1.2rem}.terminal .date{color:var(--green)}.terminal .switches{background:transparent;border:1px solid #254239;border-radius:4px}.terminal .switches a{border-radius:2px;font-family:inherit}.terminal .switches a.active{background:#163c2b;color:#a7ff72;outline:1px solid #2e8a50}.terminal .days button{font-family:inherit;border:1px solid #24513e;border-radius:3px;background:#06120d;color:#9de7bb}.terminal .days button.active{background:#123d29;color:#f7e900}.terminal .hero,.terminal .panel,.terminal .metric,.terminal .hour{background:#050b08;border:1px solid #1d4937;border-radius:3px}.terminal .section h2{color:var(--green)}.terminal .summary span,.terminal .hour .time,.terminal .hour .details{color:#7fa893}.terminal .current{color:#f7e900}.terminal .hour-list{gap:0}.terminal .hour{border-bottom:0}.terminal .hour:last-child{border-bottom:1px solid #1d4937}.terminal .metric b{color:var(--yellow)}.terminal .period{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 4px;border-bottom:1px dotted #24513e}.terminal .period:last-child{border-bottom:0}.terminal .period .label{color:#9de7bb}.terminal .period .value{color:#f7e900}.terminal .bar{height:9px;border-radius:20px;background:linear-gradient(90deg,#e04bff,#3ca7ff,#32e4d1,#b6f477,#ffdf65,#ffad67);margin:16px 0}
footer{text-align:center;color:#647d91;font-size:.72rem;padding:22px}
@media(min-width:620px){.hour-list{grid-template-columns:1fr 1fr}.hero{padding:24px}.hour{grid-template-columns:52px 30px 1fr auto}}
</style>
</head>
<body>
<header>
  <div class="topline"><div><div class="place">📍 <span id="location">Budapest</span></div><div class="date" id="date">Előrejelzés betöltése…</div></div><div class="timezone" id="timezone">Europe/Budapest</div></div>
  <nav class="switches" aria-label="Felület választása">
    <a href="?view=graph" data-view="graph">Grafikon</a><a href="?view=cards" data-view="cards">Óránkénti kártyák</a><a href="?view=terminal" data-view="terminal">Terminal</a>
  </nav>
  <div class="days"><button type="button" data-day="today" class="active">Ma</button><button type="button" data-day="tomorrow">Holnap</button></div>
</header>
<main id="app" aria-live="polite"><div class="panel">Időjárási adatok betöltése…</div></main>
<footer>Termweather · Budapest · <span id="updated">API-adatok</span></footer>
<script>
const params=new URLSearchParams(location.search);
let view=params.get('view')||'graph',day=params.get('day')==='tomorrow'?'tomorrow':'today',forecast=null;
if(!['graph','cards','terminal'].includes(view))view='graph';
document.body.classList.toggle('terminal',view==='terminal');
document.querySelectorAll('[data-view]').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b.dataset.day===day));
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{day=b.dataset.day;const u=new URL(location.href);u.searchParams.set('day',day);history.pushState({},'',u);document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x.dataset.day===day));load()}));
document.querySelectorAll('[data-view]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();view=a.dataset.view;const u=new URL(location.href);u.searchParams.set('view',view);history.pushState({},'',u);document.body.classList.toggle('terminal',view==='terminal');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));render()}));
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);view=p.get('view')||'graph';day=p.get('day')==='tomorrow'?'tomorrow':'today';document.body.classList.toggle('terminal',view==='terminal');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x.dataset.day===day));load()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hour=p=>p.time.slice(11,16);
const icon=code=>({0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'🌧️',95:'⛈️'}[code]||'🌡️');
function chart(points,withAxis=false){const vals=points.map(p=>p.temperature),min=Math.floor(Math.min(...vals)-1),max=Math.ceil(Math.max(...vals)+1),pad=withAxis?36:22,w=withAxis?360:340,h=170;const xy=vals.map((v,i)=>[pad+i*(w-pad-22)/(vals.length-1),h-pad-(v-min)/(max-min)*(h-2*pad)]);const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Óránkénti hőmérsékletgörbe"><defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#21d9ef"/><stop offset=".55" stop-color="#71f36b"/><stop offset="1" stop-color="#ffc837"/></linearGradient></defs>${[0,.25,.5,.75,1].map(t=>`<line x1="${pad}" y1="${pad+t*(h-2*pad)}" x2="${w-12}" y2="${pad+t*(h-2*pad)}" stroke="#284154" stroke-width=".7"/>`).join('')}${withAxis?`<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#6f9a80" stroke-width="1"/>${[0,.25,.5,.75,1].map(t=>`<text x="${pad-7}" y="${pad+t*(h-2*pad)+3}" fill="#9de7bb" font-size="9" text-anchor="end">${Math.round(max-t*(max-min))}°</text>`).join('')}`:''}<path d="${path}" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${xy.filter((_,i)=>i%3===0).map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${i<3?'#22d8ee':i<6?'#6df477':'#ffc837'}"/>`).join('')}</svg><div class="hourlabels"><span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span></div>`}
function hero(d,pts){const temps=pts.map(p=>p.temperature),now=pts[Math.min(new Date().getHours(),pts.length-1)]||pts[0];return `<section class="hero"><div class="bigicon">${icon(now.weather_code)}</div><div><div class="current">${Math.round(now.temperature)}°</div><div>${esc(weatherText(now.weather_code))}</div><div style="color:var(--muted);font-size:.8rem">Szél ${Math.round(now.wind_speed??0)} km/h</div></div><div class="summary"><div><span>Maximum</span><b>${Math.round(Math.max(...temps))}°</b></div><div><span>Minimum</span><b>${Math.round(Math.min(...temps))}°</b></div><div><span>Csapadék</span><b>${now.precipitation_probability??'–'}%</b></div><div><span>Páratartalom</span><b>${now.humidity??'–'}%</b></div></div></section>`}
function weatherText(code){if(code===0)return 'Derült';if([1,2].includes(code))return 'Változóan felhős';if(code===3)return 'Borult';if(code>=51&&code<=82)return 'Csapadék';if(code>=95)return 'Zivatar';return 'Változó idő'}
function row(p){return `<div class="hour"><span class="time">${hour(p)}</span><span class="icon">${icon(p.weather_code)}</span><span class="temp">${Math.round(p.temperature)}°</span><span class="details">💧 ${p.precipitation_probability??'–'}%<br>↗ ${Math.round(p.wind_speed??0)} km/h · ${p.humidity??'–'}%</span></div>`}
function periodSummary(pts) {
  const periods = [['Reggel', 6, 9], ['Délelőtt', 9, 12], ['Délben', 12, 14], ['Délután', 14, 18], ['Este', 18, 23]];
  return periods.map(([label, start, end]) => {
    const group = pts.filter(p => {
      const h = Number(p.time.slice(11, 13));
      return h >= start && h < end;
    });
    const avg = key => {
      const values = group.map(p => p[key]).filter(v => v !== null && v !== undefined);
      return values.length ? Math.round(values.reduce((sum, value) => sum + value, 0) / values.length) : null;
    };
    return `<div class="period"><span class="label">${label}</span><span class="value">Wind ${avg('wind_speed') ?? '–'} km/h</span><span class="value">Rain ${avg('precipitation_probability') ?? '–'}%</span></div>`;
  }).join('');
}
function render(){if(!forecast)return;const pts=forecast.points;const selectedDate=new Date(forecast.date+'T12:00:00');const todayDate=new Date(selectedDate);if(day==='tomorrow')todayDate.setDate(todayDate.getDate()-1);const tomorrowDate=new Date(todayDate);tomorrowDate.setDate(tomorrowDate.getDate()+1);document.querySelector('[data-day="today"]').textContent=todayDate.toLocaleDateString('hu-HU',{month:'short',day:'numeric'});document.querySelector('[data-day="tomorrow"]').textContent=tomorrowDate.toLocaleDateString('hu-HU',{month:'short',day:'numeric'});const dayText=new Date(forecast.date+'T12:00:00').toLocaleDateString('hu-HU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('location').textContent=forecast.location;document.getElementById('date').textContent=dayText;document.getElementById('timezone').textContent=forecast.timezone;let content='';
if(view==='graph'){content=`${hero(forecast,pts)}<section class="section"><h2>Hőmérséklet óránként</h2><div class="panel">${chart(pts)}</div></section><section class="section"><h2>Hatórás áttekintés</h2><div class="metrics">${pts.filter((_,i)=>i%4===0).slice(0,6).map(p=>`<div class="metric"><span>${hour(p)}</span><b>${icon(p.weather_code)} ${Math.round(p.temperature)}°</b><span>💧 ${p.precipitation_probability??'–'}%</span></div>`).join('')}</div></section>`}
else if(view==='cards'){content=`<section class="section"><h2>Óránkénti előrejelzés</h2><div class="hour-list">${pts.map(row).join('')}</div></section>`}
else{content=`<div class="bar"></div><section class="section"><h2>Temperature · ${esc(forecast.date)}</h2><div class="panel">${chart(pts,true)}</div></section><section class="section"><h2>Wind / precipitation by period</h2><div class="panel">${periodSummary(pts)}</div></section><section class="section"><h2>Humidity</h2><div class="panel">Humidity: ${pts[0].humidity??'–'}%</div></section><section class="section"><h2>Hourly forecast</h2><div class="hour-list">${pts.map(row).join('')}</div></section><section class="section"><h2>Forecast</h2><div>${esc(forecast.date)} · ${esc(forecast.timezone)}</div></section>`}
document.getElementById('app').innerHTML=content}
async function load(){document.getElementById('app').innerHTML='<div class="panel">Időjárási adatok betöltése…</div>';try{const r=await fetch('/api/forecast?day='+day);if(!r.ok)throw new Error('HTTP '+r.status);forecast=await r.json();render();document.getElementById('updated').textContent='Frissítve: '+new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('app').innerHTML='<div class="panel">Nem sikerült lekérni az előrejelzést. Ellenőrizd a kapcsolatot, majd frissítsd az oldalt.</div>'}}
load();setInterval(load,10*60*1000);
</script>
</body>
</html>

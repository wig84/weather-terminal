<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06100b">
<title>Termweather · Budapest</title>
<style>
:root{color-scheme:dark;--bg:#06100b;--panel:#0a1710;--panel-raised:#0e2116;--ink:#c9f8d8;--muted:#76a98a;--green:#75ff9a;--green-soft:#35c96b;--line:#1c5635;--shadow:#020704}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#102b1b 0,#06100b 58%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
header,main{max-width:900px;margin:auto}
header{padding:calc(28px + env(safe-area-inset-top)) 22px 16px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}
.place{font-size:clamp(1.55rem,5vw,2.7rem);font-weight:800;letter-spacing:-.055em;line-height:1.08;color:var(--green);text-shadow:0 0 18px #35c96b22}
.place::before{content:"ATMOSPHERIC FIELD NOTES / 01";display:block;font:600 .65rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--green-soft);margin-bottom:12px}
.date{color:var(--muted);margin-top:7px;font-size:.82rem}
.timezone{font:600 .68rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-align:right;padding-top:2px;color:var(--muted)}
.days{display:flex;gap:0;margin-top:18px;border:1px solid var(--line);background:#06100b}
.days button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:11px 16px;font:600 .88rem ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:background .15s,color .15s}
.days button+button{border-left:1px solid var(--line)}
.days button.active{background:#123d24;color:var(--green);box-shadow:inset 0 -2px var(--green)}
main{padding:0 22px 44px}
.section{margin-top:26px}
.section h2{display:flex;align-items:center;gap:10px;color:var(--green-soft);font:700 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
.section h2::before{content:"";width:18px;height:2px;background:var(--green)}
.hour-list{display:grid;gap:8px}
.hour{display:grid;grid-template-columns:54px 34px minmax(52px,1fr) auto;align-items:center;gap:10px;padding:14px 15px;background:linear-gradient(110deg,#0b1b11,#09150d);border:1px solid var(--line);box-shadow:3px 3px 0 #020704;min-width:0;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.hour .time{color:var(--muted);font:600 .82rem ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.hour .icon{font-size:1.3rem;text-align:center;filter:saturate(.8)}
.hour .temp{font-size:1.25rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--green)}
.hour .details{font:500 .72rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8dc5a0;text-align:right;white-space:nowrap}
.metric{display:inline-block;border-radius:3px;padding:0 3px;font-weight:800;font-variant-numeric:tabular-nums}
.metric-low{color:#75ff9a}
.metric-moderate{color:#f2df68;background:#292711}
.metric-high{color:#ffad55;background:#302013;text-shadow:0 0 8px #ffad5522}
.metric-severe{color:#ff6868;background:#301719;text-shadow:0 0 8px #ff686822}
.hour.past{opacity:.42}
.hour.current-hour{opacity:1;border-color:var(--green);box-shadow:inset 3px 0 var(--green),0 0 18px #35c96b12,3px 3px 0 #020704;background:linear-gradient(110deg,#10301b,#0a1a10)}
.hour.current-hour .time,.hour.current-hour .temp{color:var(--green);text-shadow:0 0 12px #75ff9a24}
.hour.future{opacity:1}
.panel{background:var(--panel);border:1px solid var(--line);padding:18px;box-shadow:4px 4px 0 #020704;color:var(--ink)}
footer{text-align:center;color:#527d61;font:500 .7rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:22px}
.refresh-status{font-size:.72rem;text-align:center;padding:12px 4px;font-variant-numeric:tabular-nums}
.refresh-status strong{color:var(--green);font-weight:700}
::selection{background:var(--green);color:#041008}
@media(min-width:620px){.hour-list{grid-template-columns:1fr 1fr}}
@media(max-width:480px){header{padding-left:16px;padding-right:16px}main{padding-left:16px;padding-right:16px}.topline{gap:8px}.timezone{max-width:110px;overflow-wrap:anywhere}.hour{grid-template-columns:44px 28px minmax(44px,1fr) auto;gap:7px;padding:12px 9px}.hour .details{font-size:.63rem}.hour .temp{font-size:1.15rem}}
@media(max-width:360px){.hour{grid-template-columns:40px 24px minmax(40px,1fr) auto;gap:5px;padding:10px 7px}.hour .icon{font-size:1.1rem}.hour .details{font-size:.58rem}}
@media(prefers-reduced-motion:reduce){.hour{transition:none}}
</style>
</head>
<body>
<header>
  <div class="topline"><div><div class="place">📍 <span id="location">Budapest</span></div><div class="date" id="date">Előrejelzés betöltése…</div></div><div class="timezone" id="timezone">Europe/Budapest</div></div>
<div class="days"><button type="button" data-day="today" class="active">Ma</button><button type="button" data-day="tomorrow">Holnap</button></div>
</header>
<main id="app" aria-live="polite"><div class="panel">Időjárási adatok betöltése…</div></main>
<footer>Termweather · Budapest · <span id="updated">API-adatok</span><div class="refresh-status" id="refresh-status">Auto-refresh: <strong>10:00</strong></div></footer>
<script>
const params=new URLSearchParams(location.search);
let day=params.get('day')==='tomorrow'?'tomorrow':'today',forecast=null;
document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b.dataset.day===day));
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{day=b.dataset.day;const u=new URL(location.href);u.searchParams.set('day',day);history.pushState({},'',u);document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x.dataset.day===day));load()}));
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);day=p.get('day')==='tomorrow'?'tomorrow':'today';document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x.dataset.day===day));load()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hour=p=>p.time.slice(11,16);
const icon=code=>({0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'🌧️',95:'⛈️'}[code]||'🌡️');
function valueLevel(value, thresholds){
 if(value>=thresholds[2])return 'severe';
 if(value>=thresholds[1])return 'high';
 if(value>=thresholds[0])return 'moderate';
 return 'low';
}
function row(p){
 const h=Number(p.time.slice(11,13)),now=new Date(),isToday=day==='today';
 const cls=isToday?(h<now.getHours()?'past':h===now.getHours()?'current-hour':'future'):'future';
 const weatherIcon=icon(p.weather_code);
 const rain=p.precipitation_probability;
 const wind=Math.round(p.wind_speed??0);
 const rainClass=rain==null?'metric-low':`metric-${valueLevel(Number(rain),[20,50,80])}`;
 const windClass=`metric-${valueLevel(wind,[20,40,60])}`;
 const details=`💧 <span class="metric ${rainClass}">${rain??'–'}%</span><br>↗ <span class="metric ${windClass}">${wind} km/h</span> · ${p.humidity??'–'}%`;
 return `<div class="hour ${cls}"><span class="time">${isToday&&h===now.getHours()?'> ':''}${hour(p)}</span><span class="icon">${weatherIcon}</span><span class="temp">${Math.round(p.temperature)}°</span><span class="details">${details}</span></div>`
}
function render(){if(!forecast)return;const pts=forecast.points;const selectedDate=new Date(forecast.date+'T12:00:00');const todayDate=new Date(selectedDate);if(day==='tomorrow')todayDate.setDate(todayDate.getDate()-1);const tomorrowDate=new Date(todayDate);tomorrowDate.setDate(tomorrowDate.getDate()+1);document.querySelector('[data-day="today"]').textContent=todayDate.toLocaleDateString('hu-HU',{month:'short',day:'numeric'});document.querySelector('[data-day="tomorrow"]').textContent=tomorrowDate.toLocaleDateString('hu-HU',{month:'short',day:'numeric'});const dayText=new Date(forecast.date+'T12:00:00').toLocaleDateString('hu-HU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('location').textContent=forecast.location;document.getElementById('date').textContent=dayText;document.getElementById('timezone').textContent=forecast.timezone;document.getElementById('app').innerHTML=`<section class="section"><h2>Óránkénti előrejelzés</h2><div class="hour-list">${pts.map(row).join('')}</div></section>`}
const REFRESH_MS=10*60*1000;
let nextRefresh=Date.now()+REFRESH_MS;
async function load(){
 const app=document.getElementById('app');
 if(!forecast)app.innerHTML='<div class="panel">Időjárási adatok betöltése…</div>';
 try{
  const r=await fetch('/api/forecast?day='+day,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  forecast=await r.json();render();
  document.getElementById('updated').textContent='Frissítve: '+new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
  nextRefresh=Date.now()+REFRESH_MS;
 }catch(e){
  if(!forecast)app.innerHTML='<div class="panel">Nem sikerült lekérni az előrejelzést. Ellenőrizd a kapcsolatot, majd frissítsd az oldalt.</div>';
  nextRefresh=Date.now()+60*1000;
 }
}
function updateRefreshStatus(){
 const left=Math.max(0,Math.ceil((nextRefresh-Date.now())/1000));
 const el=document.querySelector('#refresh-status strong');
 if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
 if(Date.now()>=nextRefresh)load();
}
load();
setInterval(updateRefreshStatus,1000);
</script>
</body>
</html>

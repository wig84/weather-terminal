[project]
name = "weather-terminal"
version = "0.1.0"
description = "A small graphical weather forecast for the terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
termweather = "weather_terminal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
